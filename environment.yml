name: sad2xs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - setuptools
  - wheel
  - pip:
      - pytest
      - pyyaml>=6.0
      - xsuite
      - numpy
      - pandas
      - tfs-pandas
      - matplotlib
