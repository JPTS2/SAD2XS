name: sad2xs
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # PEP 639 license expressions require setuptools 77 or newer
  - setuptools>=77
  - wheel
  # Mirrors the `dev` extra of pyproject.toml
  # `test_environment_matches_pyproject.py` fails if the two drift apart.
  - pip:
      - numpy>=2.1
      - pyyaml>=6.0
      - scipy>=1.14
      - xsuite>=0.58.0
      - tfs-pandas>=3.8
      - tqdm>=4.66
      - matplotlib>=3.9
      - pytest>=8.0
