[build-system]
# PEP 639 license expressions require setuptools 77 or newer
requires        = ["setuptools>=77"]
build-backend   = "setuptools.build_meta"

[project]
name            = "sad2xs"
version         = "0.3.0"
description     = "Conversion of SAD lattices to Xtrack format"
readme          = "README.md"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
requires-python = ">=3.13"

authors = [
    {name = "John P. T. Salvesen", email = "john.salvesen@cern.ch"}]

keywords = [
    "accelerator-physics",
    "lattice",
    "sad",
    "xsuite",
    "xtrack"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics"]

# Floors are the oldest releases known to support Python 3.13
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "xsuite>=0.59.0"]

[project.scripts]
# Builds SAD from source.
sad2xs-install-sad = "sad2xs.install_sad:install_sad"

[project.optional-dependencies]
# Required for sad2xs.sad_helpers in addition to a working SAD executable
sad-helpers = ["tfs-pandas>=3.8", "tqdm>=4.66"]
# Required for sad2xs.xsuite_helpers.plot_xsuite_sad_comparison
plotting    = ["matplotlib>=3.9"]
# Required to run the test suite
test        = ["pytest>=8.0"]
# Everything needed to develop against a checkout
dev         = ["sad2xs[sad-helpers,plotting,test]"]

[project.urls]
"Homepage"      = "https://github.com/JPTS2/SAD2XS"
"Source Code"   = "https://github.com/JPTS2/SAD2XS"
"Bug Tracker"   = "https://github.com/JPTS2/SAD2XS/issues"
"Documentation" = "https://github.com/JPTS2/SAD2XS/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["sad2xs*"]

[tool.setuptools]
include-package-data = true
