name: Test Observability

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: test-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/_test_template.yml
    with:
      pull_tag: latest
      test_files: |
        tests/observability
    secrets: inherit
