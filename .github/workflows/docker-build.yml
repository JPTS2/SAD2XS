name: SAD Docker Build

# The image carries the Python and dependency versions from a branch's
# environment.yml, while the tests run the checked-out branch. A single
# shared image therefore tests release branches against main's environment,
# which fails whenever the two declare different requirements. Each branch
# gets its own tag instead.

on:
  push:
    branches:
      - main
      - 'release/**'
  schedule:
    # Nightly at 02:00 UTC, an hour before run_tests.yml, so the tests always
    # run against an image built from that night's upstream releases.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ############################################################################
  # Which branches to build
  #
  # A push builds only the branch pushed. A scheduled run fires on the
  # default branch alone, so it fans out over main and every release branch
  # explicitly -- otherwise release-branch images would never be refreshed
  # against new upstream SAD or Xsuite releases.
  ############################################################################
  discover:
    runs-on: ubuntu-24.04
    outputs:
      refs: ${{ steps.collect.outputs.refs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect branches to build
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REFS=$(printf '%s' '${{ github.ref_name }}' | python -c 'import json,sys; print(json.dumps([sys.stdin.read()]))')
          else
            REFS=$(git ls-remote --heads origin 'main' 'release/*' \
              | sed 's#.*refs/heads/##' \
              | python -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          fi
          echo "refs=${REFS}" >> "$GITHUB_OUTPUT"
          echo "Building: ${REFS}"

  rebuild-docker:
    needs: [discover]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.refs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name and tags
        id: img
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/sad2xs-sad"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          # Tag slug: release/0.4.0 -> release-0.4.0
          SLUG=$(echo "${{ matrix.branch }}" | tr '/' '-')

          TAGS="${IMAGE}:${{ github.sha }}
          ${IMAGE}:${SLUG}"
          # :latest follows main, so anything pulling it unqualified is unaffected.
          if [ "${{ matrix.branch }}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          build-args: |
            SAD_SMOKE_PATH=tests/installation/sad_installation_test.sad
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke (SAD starts) using freshly pushed image
        run: |
          docker run --rm ${{ steps.img.outputs.image }}:${{ github.sha }} \
            sad-smoke /opt/smoke.sad 20
