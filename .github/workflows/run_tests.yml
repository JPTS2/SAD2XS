name: Run Tests

# Triggers:
#   - pull_request: catches regressions before any merge to main or a release
#     branch, running the PR's own code against the current SAD/Xsuite image.
#   - schedule (weekly): catches upstream breakage. SAD and Xsuite release
#     independently of SAD2XS, so a new version of either can silently break
#     the converter without any change on this side. Weekly runs surface that.
#   - workflow_dispatch: manual re-run from the GitHub Actions UI.

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

################################################################################
# SAD-free regression tests — BLOCKING
# Covers: packaging, CI config, parser, and writer.
# Does not invoke the SAD executable. Runs first so structural and packaging
# failures are reported immediately without waiting for Docker or SAD.
# Excludes tests marked @known_issue so only clean regressions block the gate.
################################################################################
jobs:
  sad-free:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (lowercase owner)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER_LC}/sad2xs-sad:latest" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SAD image
        run: docker pull "$IMAGE"

      - name: Run SAD-free regression tests
        env:
          SKIP_SMOKE: "1"
        run: |
          docker run --rm \
            -e SKIP_SMOKE \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            "$IMAGE" \
            bash -lc '
              python -m pip install --no-cache-dir -e . &&
              pytest -ra -q -m "not known_issue" \
                tests/packaging \
                tests/ci \
                tests/observability/test_quiet_converter_output.py \
                tests/parser \
                tests/writer
            '

################################################################################
# SAD-required regression tests — BLOCKING
# Covers: conversion, SAD helpers, observability (SAD output), examples, and
# installation. Runs only after sad-free passes, so a SAD/Xsuite version
# breakage is clearly isolated from structural failures.
# Excludes tests marked @known_issue so only clean regressions block the gate.
################################################################################
  sad-required:
    needs: [sad-free]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (lowercase owner)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER_LC}/sad2xs-sad:latest" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SAD image
        run: docker pull "$IMAGE"

      - name: Run SAD-required regression tests
        env:
          SKIP_SMOKE: "1"
        run: |
          docker run --rm \
            -e SKIP_SMOKE \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            "$IMAGE" \
            bash -lc '
              python -m pip install --no-cache-dir -e . &&
              pytest -ra -q -m "not known_issue" \
                tests/conversion \
                tests/sad_helpers \
                tests/observability \
                tests/examples \
                tests/installation
            '

################################################################################
# Known-issue tests — NON-BLOCKING
# Runs all tests marked @known_issue(N) against the full SAD environment.
# continue-on-error: true so failures here never block sad-required or PRs.
# Full failure output is preserved — these are real failures, not expected passes.
################################################################################
  known-issues:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (lowercase owner)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER_LC}/sad2xs-sad:latest" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SAD image
        run: docker pull "$IMAGE"

      - name: Run known-issue tests
        continue-on-error: true
        env:
          SKIP_SMOKE: "1"
        run: |
          docker run --rm \
            -e SKIP_SMOKE \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            "$IMAGE" \
            bash -lc '
              python -m pip install --no-cache-dir -e . &&
              pytest -ra -q -m "known_issue" tests/
            '
