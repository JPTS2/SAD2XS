name: Test CI Config

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/_test_template.yml
    with:
      pull_tag: latest
      test_files: |
        tests/ci
    secrets: inherit
