name: _Test Template

on:
  workflow_call:
    inputs:
      test_files:
        description: "Newline-separated list of test file paths (e.g. tests/test_001.py)"
        required: true
        type: string
      pull_tag:
        description: "Image tag to pull, or 'auto' to derive it from the branch under test"
        required: false
        type: string
        default: auto

permissions:
  contents: read
  packages: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ inputs.pull_tag }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.collect.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize list into JSON
        id: collect
        shell: bash
        env:
          TEST_FILES_INPUT: ${{ inputs.test_files }}
        run: |
          FILES_JSON=$(python - <<'PY'
          import json, os
          data = os.environ["TEST_FILES_INPUT"].splitlines()
          files = [x.strip() for x in data if x.strip() and not x.strip().startswith("#")]
          print(json.dumps(files))
          PY
          )
          echo "files=${FILES_JSON}" >> "$GITHUB_OUTPUT"

  run:
    needs: [discover]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.discover.outputs.files) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute IMAGE and TAG
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER_LC}/sad2xs-sad" >> "$GITHUB_ENV"

          # 'auto' resolves to the branch's own image, so a release branch is
          # never tested against main's Python and dependency versions. On a
          # pull request that means the base branch: the head branch has no
          # image of its own.
          REQUESTED="${{ inputs.pull_tag }}"
          if [ "${REQUESTED}" = "auto" ]; then
            BRANCH="${{ github.base_ref || github.ref_name }}"
            REQUESTED=$(echo "${BRANCH}" | tr '/' '-')
          fi
          echo "TAG=${REQUESTED}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The previous fallback pulled :main, a tag the build workflow never
      # pushed, so it could only ever fail. :latest always exists.
      - name: Pull image (tag=${{ inputs.pull_tag }}, fallback to :latest)
        id: pull
        run: |
          if docker pull "${IMAGE}:${TAG}"; then
            echo "image_ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '${TAG}' not found; falling back to :latest"
            docker pull "${IMAGE}:latest"
            echo "image_ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pytest ${{ matrix.test_file }}
        env:
          SKIP_SMOKE: "1"   # skip entrypoint smoke
        run: |
          docker run --rm \
            -e SKIP_SMOKE \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            "${{ steps.pull.outputs.image_ref }}" \
            bash -lc '
              python -m pip install --no-cache-dir -e . &&
              pytest -q "${{ matrix.test_file }}"
            '
