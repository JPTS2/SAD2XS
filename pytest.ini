[pytest]
testpaths =
    tests/installation
    tests/sad_helpers
    tests/sad
    tests/parser
    tests/conversion
    tests/writer
    tests/examples
    tests/packaging
    tests/observability
    tests/ci
addopts   = -ra --import-mode=importlib
markers =
    known_issue: marks a test as documenting a known open GitHub issue (deselect with -m "not known_issue")
