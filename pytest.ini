[pytest]
# tests/ci runs first -- it guards this list (test_pytest_ini_testpaths.py).
testpaths =
    tests/ci
    tests/installation
    tests/sad_helpers
    tests/sad
    tests/xsuite_helpers
    tests/xtrack
    tests/parser
    tests/conversion
    tests/writer
    tests/examples
    tests/packaging
    tests/observability
addopts   = -ra --import-mode=importlib
markers =
    known_issue: marks a test as documenting a known open GitHub issue (deselect with -m "not known_issue")
